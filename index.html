    }

    #map { flex: 1; width: 100%; }

    .distancia-box {
      margin: 6px 0;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 600;
      padding: 4px 6px;
      border-radius: 4px;
      display: inline-block;
      font-size: 12px;
    }
    .seccion-llegar {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #e2e8f0;
    }
    .titulo-llegar {
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
      display: block;
    }
    .botones-rutas {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .btn-modo {
      flex: 1;
      padding: 6px 4px;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      color: white;
      text-align: center;
    }
    .btn-caminar { background: #0284c7; }
    .btn-caminar:hover { background: #0369a1; }
    .btn-auto { background: #f59e0b; }
    .btn-auto:hover { background: #d97706; }

    .btn-externo {
      display: block;
      text-align: center;
      background: #f1f5f9;
      color: #475569;
      text-decoration: none;
      padding: 4px;
      border-radius: 4px;
      font-size: 11px;
      border: 1px solid #cbd5e1;
    }
    .btn-externo:hover { background: #e2e8f0; }

      position: absolute;
      bottom: 25px;
      left: 20px;
      background: white;
      padding: 12px 16px;
      border-radius: 8px;

      font-size: 13px;
      display: none;

    let miUbicacion = null;
    let capaPuntos = L.layerGroup().addTo(map);
    let capaRuta = L.layerGroup().addTo(map);
    let marcadorYo = null;

    const selectBarrio = document.getElementById('filtroBarrio');
    const barriosUnicos = [...new Set(puntos.map(p => p.barrio))].sort((a, b) => a.localeCompare('es'));
    barriosUnicos.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b;
      opt.textContent = b;
      selectBarrio.appendChild(opt);
    });

    function dibujarPuntos(filtro = "TODOS") {
      capaPuntos.clearLayers();
      const filtrados = puntos.filter(p => filtro === "TODOS" || p.barrio === filtro);

      filtrados.forEach(p => {
        const coord = L.latLng(p.lat, p.lng);
        const marker = L.circleMarker(coord, {
          radius: 8,
          fillColor: "#0284c7",
          color: "#ffffff",
          weight: 2,
          fillOpacity: 0.9
        });

        let contenidoPopup = `
          <div class="popup-texto">
            <strong>${p.nombre}</strong><br>
            Barrio: <span>${p.barrio}</span>
        `;

        if (miUbicacion) {
          const distMetros = Math.round(miUbicacion.distanceTo(coord));
          const distLegible = distMetros >= 1000
            ? (distMetros / 1000).toFixed(2) + " km"
            : distMetros + " metros";
         
          contenidoPopup += `
            <br><div class="distancia-box">📏 Distancia: ~${distLegible}</div>
            <div class="seccion-llegar">
              <span class="titulo-llegar">¿Cómo llegar?</span>
              <div class="botones-rutas">
                <button class="btn-modo btn-caminar" onclick="trazarRuta(${p.lat}, ${p.lng}, 'foot', '${p.nombre.replace(/'/g, "\\'")}')">🚶 Caminando</button>
                <button class="btn-modo btn-auto" onclick="trazarRuta(${p.lat}, ${p.lng}, 'driving', '${p.nombre.replace(/'/g, "\\'")}')">🚗 En Auto</button>
              </div>
              <a class="btn-externo" href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank">Abrir en Google Maps ↗</a>
            </div>
          `;
        } else {
          contenidoPopup += `
            <br><small style="color:#64748b; margin-top:6px; display:block;">
              ⚠️ Tocá <strong>'📍 Mi Ubicación'</strong> arriba para calcular la distancia y habilitar las rutas.
            </small>
          `;
        }

        contenidoPopup += `</div>`;
        marker.bindPopup(contenidoPopup);
        capaPuntos.addLayer(marker);
      });
    }

    dibujarPuntos();

    window.trazarRuta = async function(destLat, destLng, modo, nombrePunto) {
      if (!miUbicacion) {
        alert("Primero presioná '📍 Mi Ubicación'.");
        return;
      }

      const panelInfo = document.getElementById('infoRuta');
      panelInfo.style.display = 'block';
      panelInfo.innerHTML = "⏳ Calculando ruta más rápida...";

      const url = `https://router.project-osrm.org/route/v1/${modo}/${miUbicacion.lng},${miUbicacion.lat};${destLng},${destLat}?overview=full&geometries=geojson`;

      try {
        const respuesta = await fetch(url);
        const datos = await respuesta.json();

        if (!datos.routes || datos.routes.length === 0) {
          alert("No se encontró una ruta vial para ese trayecto.");
          panelInfo.style.display = 'none';
          return;
        }

        const ruta = datos.routes[0];
        const coordenadas = ruta.geometry.coordinates.map(c => [c[1], c[0]]);
        const duracionMin = Math.round(ruta.duration / 60);
        const distanciaKm = (ruta.distance / 1000).toFixed(2);

        capaRuta.clearLayers();
        const colorTrazo = (modo === 'driving') ? '#f59e0b' : '#0284c7';

        const polyline = L.polyline(coordenadas, {
          color: colorTrazo,
          weight: 5,
          opacity: 0.85
        }).addTo(capaRuta);

        map.fitBounds(polyline.getBounds(), { padding: [40, 40] });

        const etiquetaModo = (modo === 'driving') ? '🚗 En Auto' : '🚶 Caminando';
        panelInfo.innerHTML = `
          <strong class="tit">${nombrePunto}</strong>
          Modo: <strong>${etiquetaModo}</strong><br>
          Distancia calle: <strong>${distanciaKm} km</strong><br>
          Tiempo estimado: <strong>~${duracionMin} min</strong>
        `;
      } catch (e) {
        panelInfo.style.display = 'none';
        alert("Ocurrió un error al consultar el servicio de ruteo.");
      }
    };

    selectBarrio.addEventListener('change', (e) => {
      dibujarPuntos(e.target.value);
      if (capaPuntos.getLayers().length > 0) {
        const grupo = L.featureGroup(capaPuntos.getLayers());
        map.fitBounds(grupo.getBounds().pad(0.2));
      }
    });

    document.getElementById('btnGps').addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert("Tu dispositivo no soporta geolocalización.");
        return;
      }

      navigator.geolocation.getCurrentPosition((pos) => {
        miUbicacion = L.latLng(pos.coords.latitude, pos.coords.longitude);

        if (marcadorYo) {
          marcadorYo.setLatLng(miUbicacion);
        } else {
          marcadorYo = L.circleMarker(miUbicacion, {
            radius: 9,
            fillColor: "#ef4444",
            color: "#ffffff",
            weight: 2,
            fillOpacity: 1
          }).addTo(map).bindPopup("📍 <strong>Estás acá</strong>");
        }

        map.setView(miUbicacion, 15);
        dibujarPuntos(selectBarrio.value);
      }, () => {
        alert("Habilitá los permisos de ubicación en el navegador para calcular las distancias y rutas.");
      }, { enableHighAccuracy: true });
    });
  </script>
